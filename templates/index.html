<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>APP</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #000000);
      --accent-color: var(--tg-theme-button-color, #0088cc);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .warn {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
    }

    .main {
      min-height: 100vh;
      flex-direction: column;
      max-width: 460px;
      margin: 0 auto;
      background: #f5f5f5;
    }

    .aside {
      min-height: 1px;
    }

    .warn img {
      width: 120px;
      height: 120px;
      margin-bottom: 12px;
    }

    .Btn {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent-color);
      color: #fff;
      cursor: pointer;
    }

    /* TOP BAR */
    .top {
      background: #ffffff;
      color: #000;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .top-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    .top-search {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f2f2f2;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 14px;
      color: #777;
    }

    .top-search input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 14px;
    }

    /* MAIN BOARD */
    .board {
      flex: 1;
      background: #111111;
      padding: 16px 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    .board-inner {
      width: 100%;
      max-width: 360px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .forward {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      background: #2e5ae8;
      color: #ffffff;
      border-radius: 0 0 10px 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .round-label {
      margin-top: 52px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .side {
      position: absolute;
      top: 20%;
      transform: translateY(-50%);
      font-size: 11px;
      padding: 6px 8px;
      background: #2e7d32;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      max-width: 90px;
      text-align: center;
    }

    .side .light {
      width: 26px;
      height: 40px;
      border-radius: 6px;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 4px 0;
    }

    .light span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #333;
    }

    .light span.green {
      background: #2ecc71;
    }

    .side-text {
      font-size: 11px;
      line-height: 1.2;
    }

    .left { left: 0; }
    .right { right: 0; }

    .circle-wrapper {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: #2e5ae8;
      display: grid;
      place-items: center;
      position: relative;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    .sector {
      position: absolute;
      width: 50%;
      height: 50%;
      top: 50%;
      left: 50%;
      transform-origin: 0% 0%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      border: 2px solid #000;
      box-sizing: border-box;
    }

    .sector span {
      transform: translate(-40%, -40%);
    }

    .sector-1 { transform: rotate(288deg); }
    .sector-2 { transform: rotate(0deg); }
    .sector-3 { transform: rotate(72deg); }
    .sector-4 { transform: rotate(144deg); }
    .sector-5 { transform: rotate(216deg); }

    .inner {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f39c12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      text-align: center;
      padding: 10px;
      z-index: 2;
    }

    .inner span {
      margin-top: 4px;
      font-size: 14px;
    }

    /* LOWER LEFT ACTIONS */
    .bottom-actions {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .card {
      background: #1b1f2a;
      border-radius: 10px;
      padding: 8px 6px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: #ffffff;
      font-size: 11px;
      cursor: pointer;
    }

    .card-icon {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #0066ff;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .card.red-icon {
      background: #2a1717;
    }

    .card.red-icon .card-icon {
      background: #c0392b;
    }

    .card-title {
      text-align: left;
      line-height: 1.2;
    }

    /* COMMANDS / ERRORS BUTTONS */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 10px 14px 6px;
      background: #ffffff;
    }

    .btn {
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
    }

    .green { background: #2e7d32; }
    .red { background: #d9534f; }

    .nav {
      display: flex;
      justify-content: space-around;
      background: #1a1a1a;
      padding: 8px 0 10px;
      font-size: 12px;
    }

    .nav div {
      text-align: center;
      color: #fff;
      cursor: pointer;
    }

    @media (min-width: 990px) {
     .aside {
       flex: 0 0 33.333333%;
       max-width: 33.333333%;
       order: 1;
     }
     .main {
      flex: 0 0 66.666667%;
      max-width: 66.66667%;
      order: 2;
     }
    }

    @media (min-width: 1400px) {
     .aside {
       flex: 0 0 25;
       max-width: 25%;
       order: 1;
     }
     .main {
      flex: 0 0 75%;
      max-width: 75%;
     }
    }
  </style>
</head>
<body>
    <div id="notInTelegram" class="warn">
    <img alt="TLogo" src="https://telegram.org/img/t_logo.png">
    <p><strong>Упс!</strong></p>
    <p>Это приложение должно быть запущено <strong>внутри Telegram!</strong></p>
  </div>

   <!-- MAIN -->
  <div id="mainApp" class="main">

    <!-- TOP BAR -->
    <div class="top">
      <div class="top-icon pressable pressable-scale" id="btnMenu">☰</div>
      <div class="top-search">
        🔍
        <input type="text" placeholder="Search" id="searchInput">
      </div>
      <div class="top-icon pressable pressable-scale" id="btnSettings">⚙️</div>
    </div>

    <!-- MAIN BOARD -->
    <div class="board">
      <div class="board-inner">
        <div class="forward pressable" id="btnForward">Вперёд</div>
        <div class="round-label">На круговом</div>

        <!-- Side actions with traffic lights -->
        <div class="side left pressable" id="btnLeft">
          <div class="light">
            <span></span>
            <span></span>
            <span class="green"></span>
          </div>
          <div class="side-text">
            На перекрёстке<br>Налево
          </div>
        </div>

        <div class="side right pressable" id="btnRight">
          <div class="light">
            <span></span>
            <span></span>
            <span class="green"></span>
          </div>
          <div class="side-text">
            На перекрёстке<br>Направо
          </div>
        </div>

        <!-- Central circle with sectors -->
        <div class="circle-wrapper">
          <div class="sector sector-1 pressable" data-sector="1"><span>1</span></div>
          <div class="sector sector-2 pressable" data-sector="2"><span>2</span></div>
          <div class="sector sector-3 pressable" data-sector="3"><span>3</span></div>
          <div class="sector sector-4 pressable" data-sector="4"><span>4</span></div>
          <div class="sector sector-5 pressable" data-sector="5"><span>5</span></div>

          <div class="inner pressable pressable-scale" id="btnRepeat">
            🚗
            <span>ПОВТОРИТЬ</span>
          </div>
        </div>

        <!-- Bottom left cards -->
        <div class="bottom-actions">
          <div class="card pressable pressable-scale" id="btnUTurnCross">
            <div class="card-icon">↩</div>
            <div class="card-title">
              разворот<br>на перекрёстке
            </div>
          </div>

          <div class="card red-icon pressable pressable-scale" id="btnUTurnNoCross">
            <div class="card-icon">↪</div>
            <div class="card-title">
              разворот<br>вне перекрёстка
            </div>
          </div>

          <div class="card pressable pressable-scale" id="btnParking">
            <div class="card-icon">P</div>
            <div class="card-title">
              парковка
            </div>
          </div>

          <div class="card red-icon pressable pressable-scale" id="btnCancel">
            <div class="card-icon">⛔</div>
            <div class="card-title">
              отмена
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <div class="btn green pressable pressable-scale" id="btnCommands">КОМАНДЫ</div>
      <div class="btn red pressable pressable-scale" id="btnErrors">ОШИБКИ</div>
    </div>

    <!-- NAV -->
    <div class="nav">
      <div class="pressable pressable-scale" onclick="nav('home')">🏠<br>Домой</div>
      <div class="pressable pressable-scale" onclick="nav('back')">⬅<br>Назад</div>
      <div class="pressable pressable-scale" onclick="nav('select')">☰<br>Выбор</div>
      <div class="pressable pressable-scale" onclick="nav('profile')">👤<br>Профиль</div>
    </div>

  </div>

  <!-- Commands modal -->
  <div class="commands-modal" id="commandsModal">
    <div class="commands-sheet" role="dialog" aria-modal="true" aria-label="Команды">
      <div class="commands-header">
        <div class="commands-title">Команды</div>
        <button class="commands-close pressable pressable-scale" type="button" id="commandsClose">Закрыть</button>
      </div>
      <div class="commands-list" id="commandsList"></div>
    </div>
  </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      const tg = window.Telegram.WebApp;

      tg.ready();
      tg.expand();
      const notInTelegram = document.getElementById("notInTelegram");
      const mainApp = document.getElementById("mainApp");

      // Проверка по наличию данных инициализации
      if (tg.initDataUnsafe.length > 0) {
          notInTelegram.style.display = "none";
          mainApp.style.display = "flex";
      } else {
          // Если открыто просто в браузере
          notInTelegram.style.display = "flex";
          mainApp.style.display = "none";
      }

      function send(action, extra = {}) {
      const payload = {
        action,
        time: Date.now(),
        ...extra
      };

      console.log("SEND:", payload);

      if (tg.sendData) {
        tg.sendData(JSON.stringify(payload));
      }
    }

    // Top bar
    document.getElementById("btnMenu").onclick = () => send("menu");
    document.getElementById("btnSettings").onclick = () => send("settings");

    // Search
    document.getElementById("searchInput").addEventListener("input", (e) =>
      send("search_change", { query: e.target.value })
    );

    // Main controls
    document.getElementById("btnForward").onclick = () => send("forward");
    document.getElementById("btnLeft").onclick = () => send("left");
    document.getElementById("btnRight").onclick = () => send("right");
    document.getElementById("btnRepeat").onclick = () => send("repeat");

    // Numbered sectors
    document.querySelectorAll(".sector").forEach((el) => {
      el.addEventListener("click", () =>
        send("sector", { number: el.dataset.sector })
      );
    });

    // Cards
    document.getElementById("btnUTurnCross").onclick = () => send("u_turn_cross");
    document.getElementById("btnUTurnNoCross").onclick = () => send("u_turn_no_cross");
    document.getElementById("btnParking").onclick = () => send("parking");
    document.getElementById("btnCancel").onclick = () => send("cancel");

    // Action buttons
    document.getElementById("btnCommands").onclick = () => send("commands");
    document.getElementById("btnErrors").onclick = () => send("errors");

    function nav(where) {
      send("nav_" + where);
    }

    </script>
    <script src="/static/app.js"></script>
</body>
</html>
